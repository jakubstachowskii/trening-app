<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Training App — klikalny prototyp</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.app{position:relative;width:390px;height:844px;overflow:hidden;background:#000000;font-family:-apple-system,'SF Pro Text',Inter,system-ui,sans-serif}
.layer{position:absolute;inset:0}
@keyframes appfade{from{opacity:0}to{opacity:1}}
@keyframes appup{from{transform:translateY(100%)}to{transform:none}}
@keyframes appin{from{transform:translateX(32%);opacity:0}to{transform:none;opacity:1}}
.appfade{animation:appfade 200ms ease both}
.appup{animation:appup 420ms cubic-bezier(.2,.9,.3,1) both}
.appin{animation:appin 320ms cubic-bezier(.2,.9,.3,1) both}
.rm .appup,.rm .appin{animation:appfade 150ms both}
@media (prefers-reduced-motion: reduce){.appup,.appin{animation:appfade 150ms both}}
</style>
</helmet>
<div class="{{rootCls}}">
<sc-if value="{{isStart}}" hint-placeholder-val="{{true}}">
<div class="layer appfade"><dc-import name="Start" motyw="{{motyw}}" akcent="{{akcent}}" ogranicz-ruch="{{rm}}" stan="{{stan}}" on-start="{{start}}" on-nav="{{nav}}" on-summary="{{summary}}" on-settings="{{settings}}" hint-size="390px,844px"></dc-import></div>
</sc-if>
<sc-if value="{{isPlan}}" hint-placeholder-val="{{false}}">
<div class="layer appfade"><dc-import name="Plan" pusty="{{noPlan}}" motyw="{{motyw}}" akcent="{{akcent}}" ogranicz-ruch="{{rm}}" on-start="{{start}}" on-nav="{{nav}}" hint-size="390px,844px"></dc-import></div>
</sc-if>
<sc-if value="{{isPostepy}}" hint-placeholder-val="{{false}}">
<div class="layer appfade"><dc-import name="Postepy" pusto="{{noPlan}}" on-start="{{start}}" motyw="{{motyw}}" akcent="{{akcent}}" ogranicz-ruch="{{rm}}" on-nav="{{nav}}" hint-size="390px,844px"></dc-import></div>
</sc-if>
<sc-if value="{{isCwiczenia}}" hint-placeholder-val="{{false}}">
<div class="layer appfade"><dc-import name="Cwiczenia" motyw="{{motyw}}" akcent="{{akcent}}" ogranicz-ruch="{{rm}}" on-nav="{{nav}}" on-open="{{openExercise}}" hint-size="390px,844px"></dc-import></div>
</sc-if>
<sc-if value="{{isExercise}}" hint-placeholder-val="{{false}}">
<div class="layer appin"><dc-import name="Cwiczenie" motyw="{{motyw}}" akcent="{{akcent}}" ogranicz-ruch="{{rm}}" on-back="{{backToList}}" hint-size="390px,844px"></dc-import></div>
</sc-if>
<sc-if value="{{isSettings}}" hint-placeholder-val="{{false}}">
<div class="layer appin"><dc-import name="Ustawienia" motyw="{{motyw}}" akcent="{{akcent}}" ogranicz-ruch="{{rm}}" on-back="{{done}}" on-motyw="{{setMotyw}}" on-akcent="{{setAkcent}}" hint-size="390px,844px"></dc-import></div>
</sc-if>
<sc-if value="{{started}}" hint-placeholder-val="{{false}}">
<div class="layer appup" style="{{workoutStyle}}"><dc-import name="Trening" motyw="{{motyw}}" akcent="{{akcent}}" ogranicz-ruch="{{rm}}" on-close="{{done}}" on-finish="{{finish}}" hint-size="390px,844px"></dc-import></div>
</sc-if>
<sc-if value="{{isSummary}}" hint-placeholder-val="{{false}}">
<div class="layer appfade"><dc-import name="Podsumowanie" motyw="{{motyw}}" akcent="{{akcent}}" ogranicz-ruch="{{rm}}" on-done="{{done}}" hint-size="390px,844px"></dc-import></div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"motyw":{"editor":"enum","options":["ciemny","jasny"],"default":"ciemny","section":"Wygląd"},"akcent":{"editor":"enum","options":["niebieski","indygo","pomarancz","malina","zielen"],"default":"niebieski","section":"Wygląd"},"ograniczRuch":{"editor":"boolean","default":false,"section":"Wygląd"},"bezPlanu":{"editor":"boolean","default":false,"section":"Stan"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    // screen: start | plan | postepy | cwiczenia | cwiczenie | ustawienia | trening | podsumowanie
    // workout: przed | trwa | po; motyw i akcent wybrane w Ustawieniach nadpisują tweaki planszy
    this.state = { screen: 'start', workout: 'przed', motyw: null, akcent: null };
  }
  renderVals() {
    var self = this; var s = this.state; var p = this.props;
    var rm = p.ograniczRuch ?? false;
    var noPlan = (p.bezPlanu ?? false) && s.workout === 'przed';
    return {
      rootCls: 'app' + (rm ? ' rm' : ''),
      motyw: s.motyw || (p.motyw ?? 'ciemny'), akcent: s.akcent || (p.akcent ?? 'niebieski'), rm: rm,
      stan: noPlan ? 'brak' : s.workout, noPlan: noPlan,
      isStart: s.screen === 'start', isPlan: s.screen === 'plan', isPostepy: s.screen === 'postepy', isCwiczenia: s.screen === 'cwiczenia',
      isExercise: s.screen === 'cwiczenie', isSettings: s.screen === 'ustawienia', isSummary: s.screen === 'podsumowanie',
      started: s.workout === 'trwa',
      workoutStyle: s.screen === 'trening' ? '' : 'display:none',
      nav: function (id) { self.setState({ screen: id }); },
      start: function () {
        if (self.state.workout === 'po') { self.setState({ screen: 'podsumowanie' }); return; }
        self.setState({ screen: 'trening', workout: 'trwa' });
      },
      finish: function () { self.setState({ screen: 'podsumowanie', workout: 'po' }); },
      summary: function () { self.setState({ screen: 'podsumowanie' }); },
      settings: function () { self.setState({ screen: 'ustawienia' }); },
      openExercise: function () { self.setState({ screen: 'cwiczenie' }); },
      backToList: function () { self.setState({ screen: 'cwiczenia' }); },
      done: function () { self.setState({ screen: 'start' }); },
      setMotyw: function (v) { self.setState({ motyw: v }); },
      setAkcent: function (v) { self.setState({ akcent: v }); }
    };
  }
}
</script>
</body>
</html>
