<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Ustawienia</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
button{font:inherit;color:inherit;border:0;padding:0;margin:0;cursor:pointer;background:none;text-align:inherit}
.scr{--bg:#000000;--s1:#101012;--s2:#19191C;--s3:#26262A;--line:rgba(255,255,255,.09);--t1:#F5F6FA;--t2:#A3A8B8;--t3:#7C8194;--acc:#4DA3FF;--accT:#7AB8FF;--onAcc:#0B0C14;--accSoft:rgba(77,163,255,.16);--ok:#5BD38A;--glass:rgba(34,35,43,.72);--glassEdge:rgba(255,255,255,.14);--shadow:0 10px 30px rgba(0,0,0,.45);position:relative;width:390px;height:844px;overflow:hidden;background:var(--bg);color:var(--t1);font-family:-apple-system,'SF Pro Text',Inter,system-ui,sans-serif;font-size:15px;line-height:20px}
.pad{box-sizing:border-box;height:844px;padding:62px 16px 0;display:flex;flex-direction:column;overflow:hidden}
.pad>*{flex-shrink:0}
.num{font-variant-numeric:tabular-nums}
.t2{color:var(--t2)}.accT{color:var(--accT)}.ok{color:var(--ok)}
.xl,.lg,.md,.dsp{font-family:Archivo,-apple-system,'SF Pro Display',system-ui,sans-serif;font-stretch:120%}
.xl{font-size:34px;line-height:40px;font-weight:800;letter-spacing:-.02em;margin:0}
.hd{font-size:17px;line-height:22px;font-weight:600}
.sm{font-size:13px;line-height:18px}
.xs{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--t2)}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);border:1px solid var(--glassEdge);box-sizing:border-box}
.circle{flex:none;width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center}
.card{background:var(--s1);border-radius:28px;padding:16px;box-sizing:border-box}
.rowi{display:flex;align-items:center;gap:12px;min-height:56px;width:100%}
.rowi + .rowi{border-top:1px solid var(--line)}
.press{transition:transform 150ms cubic-bezier(.2,.8,.2,1)}.press:active{transform:scale(.97)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rise{animation:rise 400ms cubic-bezier(.2,.8,.2,1) both}
.sgc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));padding:3px;border-radius:999px;background:var(--s2)}
.sg{min-height:44px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:15px;line-height:20px;font-weight:600;color:var(--t2)}
.sg.on{background:var(--s3);color:var(--t1)}
.scr.lt .sg.on{background:#FFFFFF;box-shadow:0 1px 4px rgba(17,18,24,.12)}
.sw{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;transition:box-shadow 250ms ease}
.sw i{display:block;width:30px;height:30px;border-radius:15px}
.sw.on{box-shadow:inset 0 0 0 2.5px var(--t1)}
.swb{flex:none;height:44px;display:flex;align-items:center}
.switch{flex:none;display:block;width:51px;height:31px;border-radius:16px;background:var(--acc);position:relative}
.switch::after{content:"";position:absolute;right:2px;top:2px;width:27px;height:27px;border-radius:14px;background:#FFFFFF}
.rm .rise{animation:fade 150ms both}.rm .press:active{transform:none}
@media (prefers-reduced-motion: reduce){.rise{animation:fade 150ms both}.press:active{transform:none}}
</style>
</helmet>
<div class="{{rootCls}}" style="{{vars}}">
<div class="pad">
<button class="circle glass press" aria-label="Wróć" onClick="{{back}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
<h1 class="xl" style="margin-top: 12px">Ustawienia</h1>

<span class="xs rise" style="padding: 0 16px; margin-top: 20px">Wygląd</span>
<div class="card rise" style="margin-top: 8px; display: flex; flex-direction: column; gap: 16px">
<div class="sgc" role="radiogroup" aria-label="Motyw">
<button class="{{mDark}}" role="radio" aria-checked="{{isDark}}" onClick="{{setDark}}">Ciemny</button>
<button class="{{mLight}}" role="radio" aria-checked="{{isLight}}" onClick="{{setLight}}">Jasny</button>
</div>
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; flex-direction: column"><span class="hd">Akcent</span><span class="sm t2">{{accName}}</span></div>
<div role="radiogroup" aria-label="Kolor akcentu" style="display: flex; gap: 0">
<sc-for list="{{swatches}}" as="s" hint-placeholder-count="5">
<button class="{{s.cls}}" role="radio" aria-checked="{{s.on}}" aria-label="{{s.label}}" onClick="{{s.pick}}"><i style="{{s.st}}"></i></button>
</sc-for>
</div>
</div>
</div>

<span class="xs rise" style="padding: 0 16px; margin-top: 24px">Trening</span>
<div class="card rise" style="padding: 0 16px; margin-top: 8px">
<button class="rowi"><span class="hd" style="flex: 1">Cel tygodnia</span><span class="t2 num">4 treningi</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--t3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
<button class="rowi"><span class="hd" style="flex: 1">Domyślna przerwa</span><span class="t2 num">1:30</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--t3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
<button class="rowi"><span class="hd" style="flex: 1">Krok ciężaru</span><span class="t2 num">2,5 kg</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--t3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
<div class="rowi"><span class="hd" style="flex: 1">Nie wygaszaj ekranu w trakcie</span><button class="swb" role="switch" aria-checked="true" aria-label="Nie wygaszaj ekranu w trakcie treningu"><span class="switch"></span></button></div>
</div>

<span class="xs rise" style="padding: 0 16px; margin-top: 24px">Twoje dane</span>
<div class="card rise" style="padding: 0 16px; margin-top: 8px">
<button class="rowi"><div style="display: flex; flex-direction: column; flex: 1"><span class="hd">Kopia zapasowa i eksport</span><span class="sm t2">Wszystko jest zapisane tylko na tym telefonie</span></div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--t3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
<button class="rowi"><span class="hd" style="{{sDanger}}">Usuń wszystkie dane</span></button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"motyw":{"editor":"enum","options":["ciemny","jasny"],"default":"ciemny","section":"Podgląd"},"akcent":{"editor":"enum","options":["niebieski","indygo","pomarancz","malina","zielen"],"default":"niebieski","section":"Podgląd"},"ograniczRuch":{"editor":"boolean","default":false,"section":"Podgląd"},"onBack":{"editor":null},"onMotyw":{"editor":null},"onAkcent":{"editor":null},"$preview":{"width":390,"height":844}}'>
var ACC = { niebieski: { d: ['#4DA3FF', '#7AB8FF', '77,163,255'], l: ['#0A6BDB', '#0A5FC4', '10,107,219'] }, indygo: { d: ['#8B90FF', '#A9ACFF', '139,144,255'], l: ['#4F55E8', '#3F46D4', '79,85,232'] }, pomarancz: { d: ['#FF9A3D', '#FFB070', '255,154,61'], l: ['#C2500A', '#A84500', '194,80,10'] }, malina: { d: ['#FF6F9F', '#FF8FB4', '255,111,159'], l: ['#C8205C', '#B01B52', '200,32,92'] }, zielen: { d: ['#3DD68C', '#5FE0A0', '61,214,140'], l: ['#157F45', '#126E3C', '21,127,69'] } };
var NAMES = { niebieski: 'Niebieski', indygo: 'Indygo', pomarancz: 'Pomarańczowy', malina: 'Malinowy', zielen: 'Zielony' };
function theme(m, a) {
  var x = ACC[a] || ACC.niebieski;
  if (m === 'jasny') { var l = x.l; return '--bg:#F2F2F7;--s1:#FFFFFF;--s2:#F2F2F7;--s3:#E2E2EA;--line:rgba(17,18,24,.09);--t1:#111218;--t2:#5C5F6B;--t3:#686B7A;--acc:' + l[0] + ';--accT:' + l[1] + ';--onAcc:#FFFFFF;--accSoft:rgba(' + l[2] + ',.12);--ok:#17753F;--glass:rgba(255,255,255,.78);--glassEdge:rgba(255,255,255,.95);--shadow:0 10px 30px rgba(17,18,24,.16)'; }
  var d = x.d; return '--acc:' + d[0] + ';--accT:' + d[1] + ';--accSoft:rgba(' + d[2] + ',.16)';
}
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { motyw: null, akcent: null }; }
  renderVals() {
    var p = this.props; var self = this;
    // Sam ekran (bez prototypu) trzyma wybór u siebie; w prototypie wybór idzie do całej aplikacji.
    var m = this.state.motyw || (p.motyw ?? 'ciemny');
    var a = this.state.akcent || (p.akcent ?? 'niebieski');
    var light = m === 'jasny';
    var setM = function (v) { self.setState({ motyw: v }); if (self.props.onMotyw) self.props.onMotyw(v); };
    return {
      rootCls: 'scr' + (light ? ' lt' : '') + ((p.ograniczRuch ?? false) ? ' rm' : ''),
      vars: theme(m, a),
      back: function () { if (self.props.onBack) self.props.onBack(); },
      isDark: !light, isLight: light,
      mDark: 'sg' + (!light ? ' on' : ''), mLight: 'sg' + (light ? ' on' : ''),
      setDark: function () { setM('ciemny'); }, setLight: function () { setM('jasny'); },
      accName: NAMES[a],
      swatches: Object.keys(ACC).map(function (k) {
        return { label: NAMES[k], on: k === a, cls: 'sw press' + (k === a ? ' on' : ''), st: 'background:' + ACC[k][light ? 'l' : 'd'][0], pick: function () { self.setState({ akcent: k }); if (self.props.onAkcent) self.props.onAkcent(k); } };
      }),
      sDanger: 'flex:1;color:' + (light ? '#D92D20' : '#FF6B6B')
    };
  }
}
</script>
</body>
</html>
