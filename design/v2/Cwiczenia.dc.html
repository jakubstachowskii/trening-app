<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Biblioteka ćwiczeń</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
button{font:inherit;color:inherit;border:0;padding:0;margin:0;cursor:pointer;background:none;text-align:inherit}
.scr{--bg:#000000;--s1:#101012;--s2:#19191C;--s3:#26262A;--line:rgba(255,255,255,.09);--t1:#F5F6FA;--t2:#A3A8B8;--t3:#7C8194;--acc:#4DA3FF;--accT:#7AB8FF;--onAcc:#0B0C14;--accSoft:rgba(77,163,255,.16);--ok:#5BD38A;--glass:rgba(34,35,43,.72);--glassEdge:rgba(255,255,255,.14);--shadow:0 10px 30px rgba(0,0,0,.45);position:relative;width:390px;height:844px;overflow:hidden;background:var(--bg);color:var(--t1);font-family:-apple-system,'SF Pro Text',Inter,system-ui,sans-serif;font-size:15px;line-height:20px}
.pad{box-sizing:border-box;height:844px;padding:62px 16px 0;display:flex;flex-direction:column;overflow:hidden}
.pad>*{flex-shrink:0}
.num{font-variant-numeric:tabular-nums}
.t2{color:var(--t2)}.accT{color:var(--accT)}.ok{color:var(--ok)}
.xl,.lg,.md,.dsp{font-family:Archivo,-apple-system,'SF Pro Display',system-ui,sans-serif;font-stretch:120%}
.xl{font-size:34px;line-height:40px;font-weight:800;letter-spacing:-.02em;margin:0}
.hd{font-size:17px;line-height:22px;font-weight:600}
.sm{font-size:13px;line-height:18px}
.xs{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--t2)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);border:1px solid var(--glassEdge);box-sizing:border-box}
.circle{flex:none;width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center}
.card{background:var(--s1);border-radius:28px;padding:16px;box-sizing:border-box}
.rowi{display:flex;align-items:center;gap:12px;min-height:76px;width:100%}
.rowi + .rowi{border-top:1px solid var(--line)}
.tabbar{position:absolute;left:20px;right:20px;bottom:26px;height:64px;border-radius:32px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:5px;gap:2px;box-shadow:var(--shadow)}
.tab{border-radius:27px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--t2);font-size:11px;line-height:13px;font-weight:600}
.tab.on{color:var(--accT);background:var(--accSoft)}
.press{transition:transform 150ms cubic-bezier(.2,.8,.2,1)}.press:active{transform:scale(.97)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rise{animation:rise 400ms cubic-bezier(.2,.8,.2,1) both}
.search{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:14px;background:var(--s1);margin-top:16px;color:var(--t2)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:17px;color:var(--t1)}
.search input::placeholder{color:var(--t2)}
.fchips{display:flex;gap:8px;margin:12px -16px 0;padding:0 16px;overflow:hidden}
.fchip{flex:none;min-height:44px;padding:0 16px;border-radius:999px;background:var(--s1);color:var(--t2);font-size:15px;line-height:20px;font-weight:600;display:flex;align-items:center}
.fchip.on{background:var(--accSoft);color:var(--accT)}
.fig{flex:none;width:44px;height:56px;border-radius:12px;background:var(--bg);display:flex;align-items:flex-start;justify-content:center;overflow:hidden;padding-top:3px;box-sizing:border-box}
.cl2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.edge{position:absolute;left:0;right:0;bottom:0;height:130px;pointer-events:none;background:var(--bg);-webkit-mask-image:linear-gradient(transparent,#000 75%);mask-image:linear-gradient(transparent,#000 75%)}
.rm .rise{animation:fade 150ms both}.rm .press:active{transform:none}
@media (prefers-reduced-motion: reduce){.rise{animation:fade 150ms both}.press:active{transform:none}}
</style>
</helmet>
<div class="{{rootCls}}" style="{{vars}}">
<div class="pad">
<div class="rise" style="display: flex; align-items: flex-end; justify-content: space-between">
<h1 class="xl">Ćwiczenia</h1>
<button class="circle glass press" aria-label="Dodaj własne ćwiczenie"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
<label class="search rise"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg><input type="search" placeholder="Szukaj wśród 154 ćwiczeń" aria-label="Szukaj ćwiczenia"></label>
<div class="fchips rise" role="group" aria-label="Partia mięśni">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
<button class="{{c.cls}}" aria-pressed="{{c.on}}" onClick="{{c.pick}}">{{c.label}}</button>
</sc-for>
</div>
<div class="card rise" style="padding: 0 16px; margin-top: 16px">
<sc-for list="{{items}}" as="e" hint-placeholder-count="8">
<button class="rowi" onClick="{{e.open}}">
<div class="fig"><dc-import name="Cialo" mocne="{{e.m}}" lekkie="{{e.l}}" widok="{{e.v}}" kadr="{{e.k}}" wysokosc="{{figH}}" tlo="{{no}}" hint-size="16px,40px"></dc-import></div>
<div style="display: flex; flex-direction: column; flex: 1; min-width: 0"><span class="hd cl2">{{e.name}}</span><span class="sm t2">{{e.meta}}</span></div>
<span class="sm num t2" style="flex: none; font-weight: 600">{{e.best}}</span>
</button>
</sc-for>
</div>
</div>
<div class="edge" aria-hidden="true"></div>

<nav class="tabbar glass" aria-label="Karty">
<button class="{{tc.start}}" onClick="{{tg.start}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9M15.6 3.75a9 9 0 0 1 4.65 4.65"></path></svg>Dziś</button>
<button class="{{tc.plan}}" onClick="{{tg.plan}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v3M17 3v3M4 9.5h16M6 5h12a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"></path></svg>Plan</button>
<button class="{{tc.postepy}}" onClick="{{tg.postepy}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5h16M5.5 15l4.5-4.5 3 3L18.5 7"></path></svg>Postępy</button>
<button class="{{tc.cwiczenia}}" onClick="{{tg.cwiczenia}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5v11M3.5 9v6M17.5 6.5v11M20.5 9v6M6.5 12h11"></path></svg>Ćwiczenia</button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"motyw":{"editor":"enum","options":["ciemny","jasny"],"default":"ciemny","section":"Podgląd"},"akcent":{"editor":"enum","options":["niebieski","indygo","pomarancz","malina","zielen"],"default":"niebieski","section":"Podgląd"},"ograniczRuch":{"editor":"boolean","default":false,"section":"Podgląd"},"onNav":{"editor":null},"onOpen":{"editor":null},"$preview":{"width":390,"height":844}}'>
var ACC = { niebieski: { d: ['#4DA3FF', '#7AB8FF', '77,163,255'], l: ['#0A6BDB', '#0A5FC4', '10,107,219'] }, indygo: { d: ['#8B90FF', '#A9ACFF', '139,144,255'], l: ['#4F55E8', '#3F46D4', '79,85,232'] }, pomarancz: { d: ['#FF9A3D', '#FFB070', '255,154,61'], l: ['#C2500A', '#A84500', '194,80,10'] }, malina: { d: ['#FF6F9F', '#FF8FB4', '255,111,159'], l: ['#C8205C', '#B01B52', '200,32,92'] }, zielen: { d: ['#3DD68C', '#5FE0A0', '61,214,140'], l: ['#157F45', '#126E3C', '21,127,69'] } };
function theme(m, a) {
  var x = ACC[a] || ACC.niebieski;
  if (m === 'jasny') { var l = x.l; return '--bg:#F2F2F7;--s1:#FFFFFF;--s2:#F2F2F7;--s3:#E2E2EA;--line:rgba(17,18,24,.09);--t1:#111218;--t2:#5C5F6B;--t3:#686B7A;--acc:' + l[0] + ';--accT:' + l[1] + ';--onAcc:#FFFFFF;--accSoft:rgba(' + l[2] + ',.12);--ok:#17753F;--glass:rgba(255,255,255,.78);--glassEdge:rgba(255,255,255,.95);--shadow:0 10px 30px rgba(17,18,24,.16)'; }
  var d = x.d; return '--acc:' + d[0] + ';--accT:' + d[1] + ';--accSoft:rgba(' + d[2] + ',.16)';
}
function tabs(self, active) {
  var tc = {}; var tg = {};
  ['start', 'plan', 'postepy', 'cwiczenia'].forEach(function (id) {
    tc[id] = 'tab press' + (id === active ? ' on' : '');
    tg[id] = function () { if (self.props.onNav) self.props.onNav(id); };
  });
  return { tc: tc, tg: tg };
}
var GROUPS = ['Wszystkie', 'Klatka', 'Plecy', 'Nogi', 'Barki', 'Brzuch'];
// nazwa, partia, sprzęt, rekord, mięśnie główne, pomocnicze, widok figurki
var LIST = [
  ['Wyciskanie sztangi na ławce poziomej', 'Klatka', 'sztanga', '100 kg × 3', 'klatka', 'barki', 'przod', 'gora'],
  ['Wyciskanie hantli na skosie', 'Klatka', 'hantle', '34 kg × 8', 'klatka', 'barki', 'przod', 'gora'],
  ['Rozpiętki na linkach', 'Klatka', 'wyciąg', '17,5 kg × 12', 'klatka', '', 'przod', 'gora'],
  ['Podciąganie nachwytem', 'Plecy', 'masa ciała', '+10 kg × 6', 'plecy', 'barki', 'tyl', 'gora'],
  ['Wiosłowanie sztangą', 'Plecy', 'sztanga', '80 kg × 8', 'plecy', 'grzbiet', 'tyl', 'gora'],
  ['Martwy ciąg', 'Plecy', 'sztanga', '150 kg × 3', 'grzbiet,posladki,dwuglowe', 'plecy', 'tyl', 'srodek'],
  ['Przysiad ze sztangą', 'Nogi', 'sztanga', '120 kg × 5', 'uda', 'brzuch', 'przod', 'dol'],
  ['Wykroki z hantlami', 'Nogi', 'hantle', '24 kg × 10', 'uda', 'lydki', 'przod', 'dol'],
  ['Wyciskanie żołnierskie', 'Barki', 'sztanga', '60 kg × 5', 'barki', 'klatka', 'przod', 'gora'],
  ['Deska', 'Brzuch', 'masa ciała', '1:30', 'brzuch', 'barki', 'przod', 'gora']
];
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { group: 'Wszystkie' }; }
  renderVals() {
    var p = this.props; var self = this; var tb = tabs(this, 'cwiczenia'); var g = this.state.group;
    var open = function () { if (self.props.onOpen) self.props.onOpen(); };
    return {
      rootCls: 'scr' + ((p.ograniczRuch ?? false) ? ' rm' : ''),
      vars: theme(p.motyw ?? 'ciemny', p.akcent ?? 'niebieski'),
      figH: 100, no: false,
      chips: GROUPS.map(function (label) { return { label: label, on: label === g, cls: 'fchip press' + (label === g ? ' on' : ''), pick: function () { self.setState({ group: label }); } }; }),
      items: LIST.filter(function (e) { return g === 'Wszystkie' || e[1] === g; }).map(function (e) { return { name: e[0], meta: e[1] + ' · ' + e[2], best: e[3], m: e[4], l: e[5], v: e[6], k: e[7], h: e[7] === 'dol' ? 72 : 100, open: open }; }),
      tc: tb.tc, tg: tb.tg
    };
  }
}
</script>
</body>
</html>
